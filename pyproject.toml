[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certmorse"
version = "0.1.0.dev0"
description = "Stage 1 foundations for certified QAOA topology"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["certmorse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ttk: requires configured pvpython", "tsfm: requires TimesFM environment and weights", "gurobi: requires licensed Gurobi"]
