name: core tests

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Download saved Stage 1 fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v0.1 --pattern 'certmorse-*-v0.1.tar.gz*' --dir .release-assets
      - name: Verify and unpack release archives
        run: python scripts/unpack-release.py .release-assets
      - name: Run core tests
        run: python -m pytest -q -p scripts.public_gate_paths -m "not ttk and not tsfm and not gurobi"
